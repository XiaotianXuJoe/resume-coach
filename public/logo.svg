<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/>
    </filter>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C25E35"/>
      <stop offset="1" stop-color="#A8471F"/>
    </linearGradient>
  </defs>
  <!-- 印章底：圆角方形赤陶，微做旧边缘 -->
  <rect x="10" y="10" width="124" height="124" rx="26" fill="url(#seal)" filter="url(#rough)"/>
  <rect x="20" y="20" width="104" height="104" rx="18" fill="none" stroke="#FFF7EC" stroke-opacity="0.55" stroke-width="2.5" filter="url(#rough)"/>
  <!-- 简历文档线稿 glyph -->
  <g fill="none" stroke="#FFF7EC" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)">
    <!-- 纸张轮廓 -->
    <path d="M46 34 h34 l14 14 v58 a4 4 0 0 1 -4 4 h-44 a4 4 0 0 1 -4 -4 v-68 a4 4 0 0 1 4 -4 z"/>
    <path d="M80 34 v14 h14" stroke-width="4.5"/>
    <!-- 头像圆 -->
    <circle cx="58" cy="58" r="7.5" stroke-width="4.5"/>
    <!-- 文字行 -->
    <path d="M72 56 h14" stroke-width="4.5"/>
    <path d="M52 76 h38"/>
    <path d="M52 88 h38"/>
    <path d="M52 100 h24"/>
  </g>
  <!-- 印章红点小记 -->
  <circle cx="96" cy="102" r="5" fill="#FFF7EC" fill-opacity="0.85" filter="url(#rough)"/>
</svg>
